name: BestBuy Shopify Sync
on:
  schedule:
    - cron: '0 1 * * *'    # 09:00 Asia/Ulaanbaatar (UTC+8)
    - cron: '10 6 * * *'   # 14:10 Asia/Ulaanbaatar (UTC+8)
    - cron: '30 10 * * *'  # 18:30 Asia/Ulaanbaatar (UTC+8)
    - cron: '50 14 * * *'  # 22:50 Asia/Ulaanbaatar (UTC+8)
  workflow_dispatch: # Allows manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json

      - name: Create .env file from GitHub Secrets
        run: |
          echo "SHOPIFY_STORE=${{ secrets.SHOPIFY_STORE }}" >> .env
          echo "SHOPIFY_ADMIN_TOKEN=${{ secrets.SHOPIFY_ADMIN_TOKEN }}" >> .env
          echo "SHOPIFY_API_VERSION=2025-01" >> .env
          echo "BRIGHT_DATA_TOKEN=${{ secrets.BRIGHT_DATA_TOKEN }}" >> .env
          echo "BRIGHT_DATA_DATASET_ID=${{ secrets.BRIGHT_DATA_DATASET_ID }}" >> .env

      - name: Run Sync Script
        run: php sync_runner.php

